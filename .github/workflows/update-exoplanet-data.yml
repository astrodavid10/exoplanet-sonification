name: Update Exoplanet Data

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 6am UTC
  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python: regenerate src/exoplanetData.ts ──────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements_data.txt

      - name: Fetch NASA data and regenerate exoplanetData.ts
        run: python generate_exoplanet_data.py

      # ── Commit updated data file (no-op if nothing changed) ──────────────
      # generate_exoplanet_data.py writes TWO files: src/exoplanetData.ts and
      # the planet count in the intro modal inside src/exo-sonification.vue.
      # Listing only the data file here silently dropped the count update, so
      # the deployed intro drifted out of sync with the catalog.
      - uses: stefanzweifel/git-auto-commit-action@v5
        id: commit
        with:
          commit_message: "chore: update exoplanet data from NASA archive"
          file_pattern: |
            src/exoplanetData.ts
            src/exo-sonification.vue

      # ── Build (only runs if the data file actually changed) ──────────────
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changes_detected == 'true'
        with:
          node-version: '20'

      # This project is on Yarn 4 (packageManager: yarn@4.14.1, lockfile v9).
      # Corepack is what provides that binary; without it the runner's bundled
      # Yarn 1 runs against a v9 lockfile. --immutable is the Yarn 2+ spelling
      # of --frozen-lockfile, which was removed after Yarn 1.
      - name: Enable Corepack
        if: steps.commit.outputs.changes_detected == 'true'
        run: corepack enable

      - name: Install JS deps
        if: steps.commit.outputs.changes_detected == 'true'
        run: yarn install --immutable

      - name: Build
        if: steps.commit.outputs.changes_detected == 'true'
        run: npm run build

      # ── Deploy dist/ to self-hosted server via SCP ───────────────────────
      # Requires GitHub secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, DEPLOY_PATH
      - name: Deploy to server
        if: steps.commit.outputs.changes_detected == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist/"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
